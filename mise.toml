[tasks.check]
description = "Check that each SDK version is complete"
usage = 'arg "[target]" var=#true help="<platform>/<version>, e.g. macos/27.0; default: all"'
run = 'scripts/check.sh ${usage_target:-}'

[tasks."add:macos"]
description = "On a Mac: add the current Xcode's macOS SDK as macos/<version>/"
run = "scripts/macos.sh add"

[tasks."add:ios"]
description = "On a Mac: add the current Xcode's iPhone SDKs as ios/<version>/"
run = "scripts/ios.sh add"

[tasks."add:windows"]
description = "Download what windows/<version>/pins.json pins and lay it out there"
usage = 'arg "<version>" help="e.g. 10.0.28000; windows/<version>/pins.json says what to download"'
run = 'python3 -I scripts/windows.py add "windows/${usage_version}"'
